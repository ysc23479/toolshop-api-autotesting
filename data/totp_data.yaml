# ---------- POST /totp/setup ----------
setup:
  - case_name: "TOTP 设置-正常-成功"
    expect_status: 200
    expect_has_secret: true
    expect_has_qr_url: true


# ---------- POST /totp/verify ----------
verify:
  - case_name: "TOTP 验证-正确 code-启用成功"
    use_real_secret: true
    code_mode: correct
    expect_status: 200
    expect_has_message: true

  - case_name: "TOTP 验证-错误 code-400"
    use_real_secret: true
    code_mode: wrong
    expect_status: 400
    expect_error_contains: "TOTP"  

  - case_name: "TOTP 验证-code 长度 5 位-400"
    use_real_secret: true
    code: "12345"
    expect_status: 400
    xfail: true
    reason: "BUG: 文档 400，实测 404 Resource not found，服务端把格式校验错误误报为资源不存在"

  - case_name: "TOTP 验证-code 长度 7 位-400"
    use_real_secret: true
    code: "1234567"
    expect_status: 400
    xfail: true
    reason: "BUG: 文档 400，实测 404 Resource not found，服务端把格式校验错误误报为资源不存在"

  - case_name: "TOTP 验证-空 code-400"
    use_real_secret: true
    code: ""
    expect_status: 400
    xfail: true
    reason: "BUG: 文档 400，实测 404 Resource not found，服务端把格式校验错误误报为资源不存在"
    
  - case_name: "TOTP 验证-非数字 code-400"
    use_real_secret: true
    code: "abcdef"
    expect_status: 400
    xfail: true
    reason: "BUG: 文档 400，实测 404 Resource not found，服务端把格式校验错误误报为资源不存在"
    
  - case_name: "TOTP 验证-特殊字符 code-400"
    use_real_secret: true
    code: "1@#$%^"
    expect_status: 400
    xfail: true
    reason: "BUG: 文档 400，实测 404 Resource not found，服务端把格式校验错误误报为资源不存在"
    

# ---------- 权限校验  ----------
unauth:
  - case_name: "未登录-TOTP setup-401"
    method: setup
    expect_status: 401

  - case_name: "未登录-TOTP verify-401"
    method: verify
    expect_status: 401


# ---------- 场景法：完整业务流程 ----------
scenario:
  - case_name: "完整流程-setup → verify 成功启用 TOTP"
    expect_setup_status: 200
    expect_verify_status: 200