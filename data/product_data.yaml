list:
  - case_name: "查询产品列表-默认分页"
    params: {}
    expect_status: 200

  # ---- 排序 ----
  - case_name: "查询产品列表-按价格升序"
    params: { sort: "price,asc" }
    expect_status: 200
    expect_sorted_by: ["price", "asc"]

  - case_name: "查询产品列表-按价格降序"
    params: { sort: "price,desc" }
    expect_status: 200
    expect_sorted_by: ["price", "desc"]

  - case_name: "查询产品列表-按名称首字母升序"
    params: { sort: "name,asc" }
    expect_status: 200
    expect_sorted_by: ["name", "asc"]

  - case_name: "查询产品列表-按名称首字母降序"
    params: { sort: "name,desc" }
    expect_status: 200
    expect_sorted_by: ["name", "desc"]

  - case_name: "查询产品列表-按co2等级升序"
    params: { sort: "co2_rating,asc" }
    expect_status: 200
    expect_sorted_by: ["co2_rating", "asc"]

  - case_name: "查询产品列表-按co2等级降序"
    params: { sort: "co2_rating,desc" }
    expect_status: 200
    expect_sorted_by: ["co2_rating", "desc"] 
    
  # ---- 分页 ----
  - case_name: "查询产品列表-page=1（下边界）"
    params:
      page: 1
    expect_status: 200
    expect_current_page: 1

  - case_name: "查询产品列表-page=-0（下边界外）"
    params:
      page: 0
    expect_status: 200
    expect_current_page: 1

  - case_name: "查询产品列表-page=-1（下边界外）"
    params:
      page: -1
    expect_status: 200
    expect_current_page: 1

  - case_name: "查询产品列表-page=3（内部）"
    params:
      page: 3
    expect_status: 200
    expect_current_page: 3

  - case_name: "查询产品列表-page=6（上边界）"
    params: 
      page: 6
    expect_status: 200
    expect_current_page: 6

  - case_name: "查询产品列表-page=极大（上边界外）"
    params: 
      page: 999999 
    expect_status: 200
    expect_empty_data: true
    expect_current_page: 999999

  # ---- between（区间下界为 0，上界为200）----
  - case_name: "列表查询产品列表-价格区间 10-30"
    params: { between: "price,10,30" }
    expect_status: 200

  - case_name: "查询产品列表-价格区间下界 0"
    params: { between: "price,0,10" }
    expect_status: 200    
  
  - case_name: "查询产品列表-价格区间上界 200"
    params: { between: "price,30,200" }
    expect_status: 200 
  
  - case_name: "查询产品列表-价格区间下界外"
    params: { between: "price,-1,10" }
    expect_status: 200 
    expect_prices_in: [-1, 10]

  - case_name: "查询产品列表-价格区间 min>max（150-50）"
    params: { between: "price,150,50" }
    expect_status: 200
    expect_empty_data: true

  - case_name: "查询产品列表-价格区间全范围 0-200"
    params: { between: "price,0,200" }
    expect_status: 200
    
  - case_name: "查询产品列表-价格区间跨上边界 150-300"
    params: { between: "price,150,300" }
    expect_status: 200
    expect_prices_in: [150, 200]

  - case_name: "查询产品列表-价格区间完全超出 250-300"
    params: { between: "price,250,300" }
    expect_status: 200
    expect_empty_data: true

  # ---- 租赁 ----
  - case_name: "查询产品列表-仅租赁"
    params: { is_rental: "true" }
    expect_status: 200
    expect_data_not_empty: true  

  - case_name: "查询产品列表-仅非租赁"
    params: { is_rental: "false" }
    expect_status: 200
    expect_data_not_empty: true

  # ---- 过滤 ----
  - case_name: "查询产品列表-按真实品牌过滤"
    params: { by_brand: "FROM_BRAND" }
    expect_status: 200
    expect_data_not_empty: true
    expect_all_brand_ids: "FROM_BRAND"

  - case_name: "查询产品列表-按真实分类过滤"
    params: { by_category: "FROM_CATEGORY" }
    expect_status: 200
    expect_data_not_empty: true
    expect_all_category_ids: "FROM_CATEGORY"

  - case_name: "查询产品列表-按不存在的品牌过滤"
    params: { by_brand: "01AAAAAAAAAAAAAAAAAAAAAAAA" }
    expect_status: 200
    expect_empty_data: true

  - case_name: "查询产品列表-按不存在的分类过滤"
    params: { by_category: "01AAAAAAAAAAAAAAAAAAAAAAAA" }
    expect_status: 200
    expect_empty_data: true

  - case_name: "查询产品列表-品牌 ID 格式非法"
    params: { by_brand: "nonexistent-brand" }
    expect_status: 200
    expect_empty_data: true

  - case_name: "查询产品列表-分类 ID 格式非法"
    params: { by_category: "nonexistent-category" }
    expect_status: 200
    expect_empty_data: true

# ---- 组合过滤 ----
  - case_name: "查询产品列表-全参数组合"
    params:
      by_brand: "FROM_BRAND"
      by_category: "FROM_CATEGORY"
      is_rental: "false"
      between: "price,0,200"
      sort: "price,asc"
      page: 1
    expect_status: 200
    expect_data_not_empty: true
    expect_all_brand_ids: "FROM_BRAND"
    expect_all_category_ids: "FROM_CATEGORY"
    expect_prices_in: [0, 200]

detail:
  - case_name: "获取产品详情-正常ID"
    product_id: "FROM_PRODUCT"
    expect_status: 200
    expect_has_name: true

  - case_name: "获取产品详情-不存在的ID"
    product_id: "nonexistent" 
    expect_status: 404

related:
  - case_name: "相关产品-正常ID"
    product_id: "FROM_PRODUCT"
    expect_status: 200
    expect_data_not_empty: true

  - case_name: "相关产品-不存在的ID"
    product_id: "nonexistent"
    expect_status: 404
    xfail: true
    reason: "BUG: /products/{id}/related 对不存在 ID 返回 500，违反 OpenAPI 约定的 404"


search:
  - case_name: "搜索-正常关键词"
    params: { q: "hammer" }
    expect_status: 200
    expect_data_not_empty: true

  - case_name: "搜索-hammer关键字第2页"
    params: { q: "hammer", page: 2}
    expect_status: 200
    expect_empty_data: true
    expect_current_page: 2

  - case_name: "搜索-不存在关键词"
    params: { q: "zzz-no-such-product" }
    expect_status: 200
    expect_empty_data: true

  - case_name: "搜索-空字符串"
    params: { q: "" }
    expect_status: 200
    expect_empty_data: true

  - case_name: "搜索-未传 q"
    params: {}
    expect_status: 422
    xfail: true
    reason: "BUG: API文档声明 q 为 required，实际服务端返回 200 + 空 data"

  - case_name: "搜索-含 Unicode"
    params: { q: "锤子" }
    expect_status: 200
    expect_empty_data: true

create:
  - case_name: "创建产品-正常"
    expect_status: 201
    expect_has_id: true

  # ---- 字段缺失，只有description和co2_rating可选----
  - case_name: "创建-缺 name"
    omit: ["name"]
    expect_status: 422

  - case_name: "创建-缺 price"
    omit: ["price"]
    expect_status: 422

  - case_name: "创建-缺 category_id"
    omit: ["category_id"]
    expect_status: 422

  - case_name: "创建-缺 brand_id"
    omit: ["brand_id"]
    expect_status: 422

  - case_name: "创建-缺 description"
    omit: ["description"]
    expect_status: 201

  - case_name: "创建-缺 product_image_id"
    omit: ["product_image_id"]
    expect_status: 422

  - case_name: "创建-缺 is_location_offer"
    omit: ["is_location_offer"]
    expect_status: 422

  - case_name: "创建-缺 is_rental"
    omit: ["is_rental"]
    expect_status: 422

  - case_name: "创建-缺 co2_rating"
    omit: ["co2_rating"]
    expect_status: 201

  # ---- 边界值：price ----
  - case_name: "创建-price=两位小数"
    override: { price: 19.99 }
    expect_status: 201

  - case_name: "创建-price=极小正数"
    override: { price: 0.01 }
    expect_status: 201

  - case_name: "创建-price=负数"
    override: { price: -1.00 }
    expect_status: 422
    xfail: true
    reason: "BUG: POST /products 不校验 price 非负，实际返回 201 并成功创建"

  # ---- 类型非法 ----
  - case_name: "创建-price 为非数字字符串"
    override: { price: "not-a-number" }
    expect_status: 422

  # ---- 枚举不校验 ----
  - case_name: "创建-co2_rating 非标准值"
    override: { co2_rating: "X" }
    expect_status: 201

update_put:
  - case_name: "PUT 全量更新-成功"
    expect_status: 200
    override: { price: 29.99 }             # 主动改一个字段，证明全量生效
    expect_changed: ["name", "price"]
    expect_unchanged: ["brand.id", "category.id", "co2_rating", "is_rental"]

  - case_name: "PUT 全量更新-缺 name"
    omit: ["name"]
    expect_status: 422
    xfail: true
    reason: "BUG: PUT /products 缺 name 返回 200，未做必填校验"

  - case_name: "PUT 全量更新-缺 price"
    omit: ["price"]
    expect_status: 422
    xfail: true
    reason: "BUG: PUT /products 缺 price 返回 200"

  - case_name: "PUT 全量更新-price 为负数"
    override: { price: -1 }
    expect_status: 422
    xfail: true
    reason: "BUG: PUT /products 不校验 price 非负，返回 200"

  - case_name: "PUT 全量更新-不存在的 ID"
    product_id: "01AAAAAAAAAAAAAAAAAAAAAAAA"
    expect_status: 404

update_patch:
  - case_name: "PATCH 部分更新-只改 name"
    partial_payload: { name: "<auto>" }    # <auto> 由代码替换成唯一值
    expect_status: 200
    expect_changed: ["name"]
    expect_unchanged: ["price", "brand.id", "category.id", "co2_rating"]

  - case_name: "PATCH 部分更新-只改 price（不传 name）"
    partial_payload: { price: 29.99 }
    expect_status: 200
    expect_changed: ["price"]
    expect_unchanged: ["name", "brand.id", "category.id", "co2_rating"]

  - case_name: "PATCH 部分更新-空 body（no-op）"
    partial_payload: {}
    expect_status: 200
    expect_unchanged: ["name", "price", "brand.id", "category.id", "co2_rating"]

  - case_name: "PATCH 部分更新-price 为负数"
    partial_payload: { price: -1 }
    expect_status: 422
    xfail: true
    reason: "BUG: PATCH /products 不校验 price 非负，返回 200"

  - case_name: "PATCH 部分更新-不存在的 ID"
    product_id: "01AAAAAAAAAAAAAAAAAAAAAAAA"
    partial_payload: { price: 29.99 }
    expect_status: 404

delete:
  - case_name: "删除产品-正常"
    expect_status: 204

  - case_name: "删除产品-不存在的ID"
    product_id: "01AAAAAAAAAAAAAAAAAAAAAAAA"
    expect_status: 404

delete_unauth:
  - case_name: "删除产品-未认证"
    expect_status: 401

delete_forbidden:
  - case_name: "删除产品-普通用户越权"
    expect_status: 403