# ---------- 列表 ----------
list:
  - case_name: "发票列表-普通用户默认分页"
    login_as: "user"
    params: {}
    expect_status: 200
    expect_key: "data"

  - case_name: "发票列表-普通用户第一页"
    login_as: "user"
    params: { page: 1 }
    expect_status: 200
    expect_current_page: 1

  - case_name: "发票列表-管理员查看全部"
    login_as: "admin"
    params: {}
    expect_status: 200
    expect_key: "data"

  - case_name: "发票列表-无token"
    login_as: "none"
    params: {}
    expect_status: 401
    expect_error: "Unauthorized"

# ---------- 搜索 ----------
search:
    # ==== 按 invoice_number 搜 ====
  - case_name: "搜索发票-完整 invoice_number"
    login_as: "admin"
    params: { q: "FROM_INVOICE_NUMBER" }
    expect_status: 200
    expect_data_not_empty: true

  - case_name: "搜索发票-invoice_number 前缀"
    login_as: "admin"
    params: { q: "INV-" }
    expect_status: 200
    expect_data_not_empty: true
    doc_note: "前缀匹配；若服务端为整词匹配则改为 expect_empty_data"

  - case_name: "搜索发票-invoice_number 后缀"
    login_as: "admin"
    params: { q: "FROM_INVOICE_NUMBER_SUFFIX" }
    expect_status: 200
    doc_note: "后 6 位数字；匹配能力需实测确认"

    # ==== 按 billing_street 搜 ====
  - case_name: "搜索发票-完整 billing_street"
    login_as: "admin"
    params: { q: "FROM_INVOICE_BILLING_STREET" }
    expect_status: 200

  - case_name: "搜索发票-部分 billing_street"
    login_as: "admin"
    params: { q: "FROM_INVOICE_BILLING_STREET_PARTIAL" }
    expect_status: 200

  - case_name: "搜索发票-不存在的 billing_street"
    login_as: "admin"
    params: { q: "No Such Street XYZ" }
    expect_status: 200
    expect_empty_data: true

  # ==== 按 status 搜 ====
  - case_name: "搜索发票-status=AWAITING_FULFILLMENT"
    login_as: "admin"
    params: { q: "AWAITING_FULFILLMENT" }
    expect_status: 200

  - case_name: "搜索发票-status=COMPLETED"
    login_as: "admin"
    params: { q: "COMPLETED" }
    expect_status: 200

  - case_name: "搜索发票-status 部分匹配（AWAITING）"
    login_as: "admin"
    params: { q: "AWAITING" }
    expect_status: 200
    doc_note: "status 列按部分匹配应能命中 AWAITING_FULFILLMENT/AWAITING_SHIPMENT"

  - case_name: "搜索发票-status 小写（completed）"
    login_as: "admin"
    params: { q: "completed" }
    expect_status: 200
    doc_note: "验证 status 搜索是否大小写敏感；不敏感时应命中"

  # ==== 分页 ====
  - case_name: "搜索发票-q 命中 + page=1"
    login_as: "admin"
    params: { q: "INV-", page: 1 }
    expect_status: 200
    expect_current_page: 1

  - case_name: "搜索发票-q 命中 + page=2"
    login_as: "admin"
    params: { q: "INV-", page: 2 }
    expect_status: 200
    doc_note: "结果不足 2 页时返回 200 + 空 data；对齐 product 项目风格"

  # ==== 认证 ====
  - case_name: "搜索发票-普通用户"
    login_as: "user"
    params: { q: "INV-" }
    expect_status: 200
    expect_key: "data"
    doc_note: "文档描述 list 中 user 只返回相关发票；search 是否按同样规则过滤需实测确认"

  - case_name: "搜索发票-无token"
    login_as: "none"
    params: { q: "INV" }
    expect_status: 401
    expect_error: "Unauthorized"

# ---------- 详情 ----------
get:
  - case_name: "查发票-正常"
    invoice_id: "FROM_INVOICE"
    expect_status: 200
    expect_has_invoicelines: true

  - case_name: "查发票-不存在的ID"
    invoice_id: "01AAAAAAAAAAAAAAAAAAAAAAAA"
    expect_status: 404

  - case_name: "查发票-无token"
    login_as: "none"
    invoice_id: "FROM_INVOICE"
    expect_status: 401
    expect_error: "Unauthorized"

# ---------- 创建 ----------
create:
  - case_name: "创建发票-现金支付"
    payment_method: "cash-on-delivery"
    expect_status: 201
    expect_has_invoice_number: true
    doc_note: "API文档 写 200，实测返回 201；与 product create 项目惯例一致，以实测为准"
  
  - case_name: "创建发票-信用卡支付"
    payment_method: "credit-card"
    payment_details:
      credit_card_number: "4111111111111111"
      expiration_date: "12/2030"
      cvv: "123"
      card_holder_name: "John Doe"
    expect_status: 201
    expect_has_invoice_number: true
    doc_note: "API文档 写 200，实测返回 201；与 product create 项目惯例一致，以实测为准"
  
  - case_name: "创建发票-缺 billing_street"
    payment_method: "cash-on-delivery"
    omit: ["billing_street"]
    expect_status: 422

  - case_name: "创建发票-缺 billing_city"
    payment_method: "cash-on-delivery"
    omit: ["billing_city"]
    expect_status: 422

  - case_name: "创建发票-缺 billing_state"
    payment_method: "cash-on-delivery"
    omit: ["billing_state"]
    expect_status: 422
    xfail: true
    reason: "BUG: API文档 InvoiceRequest.required 含 billing_state，实测后端未校验，返回 201 并成功创建发票"
  
  - case_name: "创建发票-缺 billing_country"
    payment_method: "cash-on-delivery"
    omit: ["billing_country"]
    expect_status: 422

  - case_name: "创建发票-缺 billing_postal_code"
    payment_method: "cash-on-delivery"
    omit: ["billing_postal_code"]
    expect_status: 422
    xfail: true
    reason: "BUG: API文档 InvoiceRequest.required 含 billing_postal_code，实测后端未校验，返回 201 并成功创建发票"
  
  - case_name: "创建发票-缺 cart_id"
    payment_method: "cash-on-delivery"
    omit: ["cart_id"]
    expect_status: 422

  - case_name: "创建发票-不存在的支付方式"
    payment_method: "nonexistent-method"
    expect_status: 422

  - case_name: "创建发票-无token"
    login_as: "none"
    payment_method: "cash-on-delivery"
    expect_status: 401
    expect_error: "Unauthorized"

# ---------- 游客下单 ----------
guest:
  - case_name: "游客下单-正常"
    payment_method: "cash-on-delivery"
    guest_email: "guest_test@example.com"
    guest_first_name: "Guest"
    guest_last_name: "User"
    expect_status: 200
    expect_has_invoice_number: true
    xfail: true
    reason: "BUG: POST /invoices/guest 返回 404 ResourceNotFoundResponse，当前环境未实现或未启用 guest 端点"

  - case_name: "游客下单-缺 guest_email"
    payment_method: "cash-on-delivery"
    guest_first_name: "Guest"
    guest_last_name: "User"
    expect_status: 422
    xfail: true
    reason: "BUG: OpenAPI 中 guest_email 未标 required，按业务常理期望 422"

# ---------- PUT 更新 ----------
update_put:
  - case_name: "PUT 更新发票-正常"
    payment_method: "cash-on-delivery"
    expect_status: 200
    expect_success: true

  - case_name: "PUT 更新发票-缺 billing_street"
    payment_method: "cash-on-delivery"
    omit: ["billing_street"]
    expect_status: 422

  - case_name: "PUT 更新发票-不存在的ID"
    invoice_id: "nonexistent"
    payment_method: "cash-on-delivery"
    expect_status: 404

  - case_name: "PUT 更新发票-无token"
    login_as: "none"
    payment_method: "cash-on-delivery"
    expect_status: 401

# ---------- PATCH 更新 ----------
update_patch:
  - case_name: "PATCH 更新发票-只改 billing_city"
    partial_payload:
      billing_city: "Patched City"
    expect_status: 200
    expect_success: true

  - case_name: "PATCH 更新发票-不存在的ID"
    invoice_id: "nonexistent"
    partial_payload:
      billing_city: "Patched City"
    expect_status: 404

# ---------- 更新状态 ----------
status:
  - case_name: "改状态-正常（AWAITING_FULFILLMENT）"
    status: "AWAITING_FULFILLMENT"
    status_message: "Order received"
    expect_status: 200
    expect_success: true

  - case_name: "改状态-合法枚举 ON_HOLD"
    status: "ON_HOLD"
    status_message: "On hold"
    expect_status: 200

  - case_name: "改状态-合法枚举 SHIPPED"
    status: "SHIPPED"
    status_message: "Shipped out"
    expect_status: 200

  - case_name: "改状态-合法枚举 COMPLETED"
    status: "COMPLETED"
    status_message: "Completed"
    expect_status: 200

  - case_name: "改状态-非法状态值"
    status: "INVALID_STATUS_XYZ"
    status_message: "test"
    expect_status: 422
    xfail: true
    reason: "BUG: status 为 enum，按 OpenAPI 应 422；若实测非 422 记录契约缺口"

  - case_name: "改状态-status_message 下边界 5"
    status: "ON_HOLD"          
    status_message: "12345"
    expect_status: 200

  - case_name: "改状态-status_message 下边界外 4"
    status: "ON_HOLD"
    status_message: "1234"
    expect_status: 422
    xfail: true
    reason: "BUG: schema 为 [5,50]，按契约应 422；实测后端返回 404 Resource not found"

  - case_name: "改状态-status_message 上边界 50"
    status: "ON_HOLD"
    status_message: "12345678901234567890123456789012345678901234567890"
    expect_status: 200

  - case_name: "改状态-status_message 上边界外 51"
    status: "ON_HOLD"
    status_message: "123456789012345678901234567890123456789012345678901"
    expect_status: 422
    xfail: true
    reason: "BUG: schema 为 [5,50]，按契约应 422；实测后端返回 404 Resource not found"

  - case_name: "改状态-status_message 为 null"
    status: "ON_HOLD"
    status_message: null
    expect_status: 200

  - case_name: "改状态-不存在的ID"
    invoice_id: "nonexistent"
    status: "AWAITING_FULFILLMENT"
    status_message: "test"
    expect_status: 404

  - case_name: "改状态-无token"
    login_as: "none"
    status: "AWAITING_FULFILLMENT"
    status_message: "test"
    expect_status: 401

# ---------- PDF 状态 ----------
pdf_status:
  - case_name: "PDF状态-正常"
    invoice_number: "FROM_INVOICE"
    expect_status: 200

  - case_name: "PDF状态-不存在的发票号"
    invoice_number: "NOT-EXIST-NUMBER"
    expect_status: 400
    doc_note: "文档写 404，实测返回 400 + {\"status\":\"NOT_INITIATED\"}；端点不校验发票号存在性"

  - case_name: "PDF状态-无token"
    login_as: "none"
    invoice_number: "FROM_INVOICE"
    expect_status: 401

# ---------- PDF 下载 ----------
pdf_download:
  - case_name: "下载PDF-正常"
    invoice_number: "FROM_INVOICE"
    expect_status: 200

  - case_name: "下载PDF-不存在的发票号"
    invoice_number: "NOT-EXIST-NUMBER"
    expect_status: 404

  - case_name: "下载PDF-无token"
    login_as: "none"
    invoice_number: "FROM_INVOICE"
    expect_status: 401